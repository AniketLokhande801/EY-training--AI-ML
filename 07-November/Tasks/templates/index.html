<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; min-height: 120px; padding: 8px; font-size: 14px; }
    button { padding: 10px 16px; margin-top: 8px; font-size: 14px; cursor: pointer; }
    .result { margin-top: 20px; padding: 12px; border: 1px solid #ddd; background: #f9f9f9; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>AI Assistant</h1>

  <form method="post">
    <label for="query"><b>Enter your query:</b></label><br />
    <textarea id="query" name="query" placeholder="Ask something...">{{ query if query else '' }}</textarea><br />
    <button type="submit">Submit</button>
  </form>

  {% if result %}
  <div class="result">
    <strong>Response:</strong><br />
    {{ result }}
  </div>
  {% endif %}
</body>
</html>
